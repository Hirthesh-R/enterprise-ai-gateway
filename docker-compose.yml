# docker compose up --build   → http://localhost:8000
# Override secrets via a local .env file (never committed) or shell variables.
services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: mysql+aiomysql://gateway:${MYSQL_PASSWORD:-gateway_dev_password}@mysql:3306/gateway
      REDIS_URL: redis://redis:6379/0
      API_SECRET: ${API_SECRET:-docker-dev-secret-change-me-please}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      RATE_LIMIT_TOKENS: ${RATE_LIMIT_TOKENS:-100}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: gateway
      MYSQL_USER: gateway
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-gateway_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_password}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql_data:
